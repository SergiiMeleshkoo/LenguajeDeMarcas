<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Precios de cafetería</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        tr:nth-child(even) {
            background-color: lightyellow;
        }

        tr:nth-child(odd) {
            background-color: white;
        }
    </style>
</head>
<!-- He usado nth-child even y odd ya que el ejercicio pedia color de fondo alterno a las filas,
 que supongo que era alternar colores entre estas y para no repetir todo el rato el color en cada fila -->
<body>

    <h1>Tarifas de cafetería</h1>

    <table>
        <tr>
            <th colspan="3">Menú de desayunos</th>
        </tr>

        <tr>
            <th>Producto</th>
            <th>Tamaño</th>
            <th>Precio</th>
        </tr>

        <tr>
            <td rowspan="2">Café con leche</td>
            <td>Pequeño</td>
            <td>1,50 €</td>
        </tr>

        <tr>
            <td>Grande</td>
            <td>2,00 €</td>
        </tr>

        <tr>
            <td rowspan="2">Zumo de naranja</td>
            <td>Pequeño</td>
            <td>2,00 €</td>
        </tr>

        <tr>
            <td>Grande</td>
            <td>3,00 €</td>
        </tr>

        <tr>
            <td>Tostada</td>
            <td>Normal</td>
            <td>1,80 €</td>
        </tr>

    </table>

</body>
</html>
