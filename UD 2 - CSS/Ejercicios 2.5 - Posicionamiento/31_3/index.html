<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Tarjetas de productos</h1>

    <div class="productos">
        <div class="tarjeta">
            <span class="etiqueta">-20%</span>
            <div class="foto"></div>
            <h2>Auriculares</h2>
            <p>Precio: 40 €</p>
        </div>

        <div class="tarjeta">
            <div class="foto"></div>
            <h2>Teclado</h2>
            <p>Precio: 30 €</p>
        </div>

        <div class="tarjeta">
            <div class="foto"></div>
            <h2>Ratón</h2>
            <p>Precio: 20 €</p>
        </div>
       
    </div>

    <h2>Comentarios</h2>

    <div class="tarjeta_display_none">
        <div class="foto"></div>
        <h2>Ratón</h2>
        <p>Precio: 20 €</p>
    </div>

    <div class="tarjeta_visibility_hidden">
        <div class="foto"></div>
        <h2>Ratón</h2>
        <p>Precio: 20 €</p>
    </div>

    <div class="comentarios">
        <p>Muy buen producto.</p>
        <p>Funciona perfectamente.</p>
        <p>La calidad es bastante buena.</p>
        <p>Lo recomiendo.</p>
        <p>El envío fue rápido.</p>
        <p>Buena relación calidad-precio.</p>
    </div>

        

</body>
</html>
