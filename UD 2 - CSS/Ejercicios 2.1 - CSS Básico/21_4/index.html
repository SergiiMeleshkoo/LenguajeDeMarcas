<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selectores de id y atributo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Parte A: selector de id -->

    <h1 id="corp">Mi página web</h1>

    <h2 class="corp">Sección principal</h2>

    <p>Este es un ejemplo de una página web.</p>

    <!-- Parte B: selector de atributo -->

    <h2>Enlaces</h2>

    <ul>
        <li><a href="https://www.google.com" target="_blank">Google</a></li>
        <li><a href="https://www.youtube.com" target="_blank">YouTube</a></li>
        <li><a href="https://www.wikipedia.org">Wikipedia</a></li>
        <li><a href="https://www.github.com">GitHub</a></li>
    </ul>

    <h2>Párrafos</h2>

    <p class="destacado">Este párrafo tiene atributo class.</p>

    <p class="destacado">Este también tiene atributo class.</p>

    <p>Este párrafo no tiene atributo class.</p>

    <p>Este tampoco tiene atributo class.</p>

</body>
</html>
